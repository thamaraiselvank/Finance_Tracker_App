
steps:
  # 1. Build the backend image with unique and latest tags.
  - id: build-backend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - asia-south1-docker.pkg.dev/finance-tracker-app-512203/finance-tracker-repo/finance-tracker-backend:$SHORT_SHA
      - -t
      - asia-south1-docker.pkg.dev/finance-tracker-app-512203/finance-tracker-repo/finance-tracker-backend:latest
      - ./backend

  # 2. Build the frontend image.
  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - asia-south1-docker.pkg.dev/finance-tracker-app-512203/finance-tracker-repo/finance-tracker-frontend:$SHORT_SHA
      - -t
      - asia-south1-docker.pkg.dev/finance-tracker-app-512203/finance-tracker-repo/finance-tracker-frontend:latest
      - ./frontend

  # 3. Connect Cloud Build to the existing GKE cluster.
  - id: get-gke-credentials
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: gcloud
    args:
      - container
      - clusters
      - get-credentials
      - finance-tracker-standard
      - --region=asia-south1
      - --project=finance-tracker-app-512203

  # 4. Update the backend image. The first container is the app;
  # the Cloud SQL Auth Proxy sidecar remains unchanged.
  - id: deploy-backend
    name: gcr.io/cloud-builders/kubectl
    entrypoint: bash
    env:
      - CLOUDSDK_COMPUTE_REGION=asia-south1
      - CLOUDSDK_CONTAINER_CLUSTER=finance-tracker-standard
    args:
      - -c
      - |
        CONTAINER=$$(kubectl get deployment finance-tracker-backend \
          -o jsonpath='{.spec.template.spec.containers[0].name}')
        kubectl set image deployment/finance-tracker-backend \
          "$${CONTAINER}=asia-south1-docker.pkg.dev/finance-tracker-app-512203/finance-tracker-repo/finance-tracker-backend:$SHORT_SHA"
        kubectl rollout status deployment/finance-tracker-backend --timeout=300s

  # 5. Update the frontend image.
  - id: deploy-frontend
    name: gcr.io/cloud-builders/kubectl
    entrypoint: bash
    env:
      - CLOUDSDK_COMPUTE_REGION=asia-south1
      - CLOUDSDK_CONTAINER_CLUSTER=finance-tracker-standard
    args:
      - -c
      - |
        CONTAINER=$$(kubectl get deployment finance-tracker-frontend \
          -o jsonpath='{.spec.template.spec.containers[0].name}')
        kubectl set image deployment/finance-tracker-frontend \
          "$${CONTAINER}=asia-south1-docker.pkg.dev/finance-tracker-app-512203/finance-tracker-repo/finance-tracker-frontend:$SHORT_SHA"
        kubectl rollout status deployment/finance-tracker-frontend --timeout=300s

images:
  - asia-south1-docker.pkg.dev/finance-tracker-app-512203/finance-tracker-repo/finance-tracker-backend:$SHORT_SHA
  - asia-south1-docker.pkg.dev/finance-tracker-app-512203/finance-tracker-repo/finance-tracker-backend:latest
  - asia-south1-docker.pkg.dev/finance-tracker-app-512203/finance-tracker-repo/finance-tracker-frontend:$SHORT_SHA
  - asia-south1-docker.pkg.dev/finance-tracker-app-512203/finance-tracker-repo/finance-tracker-frontend:latest

options:
  logging: CLOUD_LOGGING_ONLY
