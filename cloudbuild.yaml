
steps:
  # 1. Build the backend with commit-specific and latest tags.
  - id: build-backend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - asia-south1-docker.pkg.dev/finance-tracker-app-512203/finance-tracker-repo/finance-tracker-backend:$SHORT_SHA
      - -t
      - asia-south1-docker.pkg.dev/finance-tracker-app-512203/finance-tracker-repo/finance-tracker-backend:latest
      - ./backend

  # 2. Build the frontend.
  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - asia-south1-docker.pkg.dev/finance-tracker-app-512203/finance-tracker-repo/finance-tracker-frontend:$SHORT_SHA
      - -t
      - asia-south1-docker.pkg.dev/finance-tracker-app-512203/finance-tracker-repo/finance-tracker-frontend:latest
      - ./frontend

  # 3. Push backend commit-specific image.
  - id: push-backend-sha
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-south1-docker.pkg.dev/finance-tracker-app-512203/finance-tracker-repo/finance-tracker-backend:$SHORT_SHA

  # 4. Push backend latest image.
  - id: push-backend-latest
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-south1-docker.pkg.dev/finance-tracker-app-512203/finance-tracker-repo/finance-tracker-backend:latest

  # 5. Push frontend commit-specific image.
  - id: push-frontend-sha
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-south1-docker.pkg.dev/finance-tracker-app-512203/finance-tracker-repo/finance-tracker-frontend:$SHORT_SHA

  # 6. Push frontend latest image.
  - id: push-frontend-latest
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-south1-docker.pkg.dev/finance-tracker-app-512203/finance-tracker-repo/finance-tracker-frontend:latest

  # 7. Connect to GKE and deploy the backend.
  - id: deploy-backend
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        apt-get update
        apt-get install -y kubectl google-cloud-cli-gke-gcloud-auth-plugin

        gcloud container clusters get-credentials finance-tracker-standard \
          --region=asia-south1 \
          --project=finance-tracker-app-512203

        kubectl set image deployment/finance-tracker-backend \
          backend=asia-south1-docker.pkg.dev/finance-tracker-app-512203/finance-tracker-repo/finance-tracker-backend:$SHORT_SHA

        kubectl rollout status deployment/finance-tracker-backend --timeout=600s

  # 8. Connect to GKE and deploy the frontend.
  - id: deploy-frontend
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        apt-get update
        apt-get install -y kubectl google-cloud-cli-gke-gcloud-auth-plugin

        gcloud container clusters get-credentials finance-tracker-standard \
          --region=asia-south1 \
          --project=finance-tracker-app-512203

        kubectl set image deployment/finance-tracker-frontend \
          frontend=asia-south1-docker.pkg.dev/finance-tracker-app-512203/finance-tracker-repo/finance-tracker-frontend:$SHORT_SHA

        kubectl rollout status deployment/finance-tracker-frontend --timeout=600s
